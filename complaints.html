<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FRALEN Calling CRM — Complaints</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #1B2A6B; --accent: #4F6BF0; --accent-soft: #EEF1FE; --gray: #6B7280; --border: #C5D3E8;
    --green: #10B981; --orange: #F59E0B; --red: #EF4444; }
  body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #111827; min-height: 100vh; padding-bottom: 20px; }
  .topbar { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-logo { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900; color: white; letter-spacing: 2px; }
  .topbar-logo span { color: #F59E0B; }
  .header-actions { display:flex; gap:8px; }
  .back-btn, .add-btn { background: rgba(255,255,255,0.15); color: white; border: none; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .add-btn { background: var(--accent); }
  .container { padding: 16px; max-width: 800px; margin: 0 auto; }

  .comp-card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 13px 16px; margin-bottom: 9px; }
  .comp-card.urgent { border-left: 4px solid var(--red); }
  .comp-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .comp-top h4 { color: var(--navy); font-size: 14.5px; font-weight: 800; }
  .comp-desc { font-size: 12.5px; color: #374151; margin-bottom: 8px; }
  .comp-meta { font-size: 11.5px; color: var(--gray); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .comp-meta span { background: #F3F4F6; padding: 2px 8px; border-radius: 20px; }
  .status-select { padding: 6px 10px; border-radius: 20px; border: none; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .s-Open { background: #FEE2E2; color: #B91C1C; }
  .s-Assigned { background: #FEF3C7; color: #B45309; }
  .s-In-Progress { background: #DBEAFE; color: #1D4ED8; }
  .s-Resolved, .s-Closed { background: #D1FAE5; color: #047857; }
  .priority-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .pr-Urgent { background: #FEE2E2; color: #B91C1C; }
  .pr-High { background: #FED7AA; color: #C2410C; }
  .pr-Normal { background: #F3F4F6; color: var(--gray); }

  .empty-state, .loading { text-align: center; padding: 40px 20px; color: var(--gray); font-size: 13.5px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 22px; width: 100%; max-width: 380px; }
  .modal h2 { color: var(--navy); font-size: 16px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13.5px; outline: none; font-family: inherit; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .btn-cancel { padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 8px; background: white; font-size: 13px; cursor: pointer; }
  .btn-save { padding: 8px 18px; border: none; border-radius: 8px; background: var(--navy); color: white; font-size: 13px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">📞 FRALEN <span>CALLING</span></div>
  <div class="header-actions">
    <button class="add-btn" onclick="window.openAddModal()">➕ Add Complaint</button>
    <button class="back-btn" onclick="window.location.href='dashboard.html'">← Dashboard</button>
  </div>
</div>
<div class="container">
  <div id="list-body"><div class="loading">Loading complaints...</div></div>
</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h2>🚨 New Complaint</h2>
    <div class="field"><label>Customer Name</label><input type="text" id="c-name"/></div>
    <div class="field"><label>Mobile</label><input type="tel" id="c-mobile"/></div>
    <div class="field"><label>Category</label>
      <select id="c-category"><option>Frame</option><option>Lens</option><option>Power</option><option>Coating</option><option>Fitting</option><option>Delivery</option><option>Warranty</option><option>Staff Behaviour</option><option>Billing</option><option>Other</option></select>
    </div>
    <div class="field"><label>Priority</label><select id="c-priority"><option>Normal</option><option>High</option><option>Urgent</option></select></div>
    <div class="field"><label>Description</label><textarea id="c-desc" rows="3"></textarea></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="window.closeAddModal()">Cancel</button>
      <button class="btn-save" onclick="window.saveComplaint()">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { getDocs, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { requireAuth, tenantCollection } from "./firebase-config.js";

let currentUid = null;
let complaints = [];
requireAuth((user) => { currentUid = user.uid; load(); });

async function load() {
  const body = document.getElementById('list-body');
  try {
    const snap = await getDocs(tenantCollection(currentUid, "complaints"));
    complaints = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const order = { Urgent: 0, High: 1, Normal: 2 };
    complaints.sort((a, b) => (order[a.priority] ?? 9) - (order[b.priority] ?? 9) || new Date(b.createdAt) - new Date(a.createdAt));
    render();
  } catch (err) { body.innerHTML = `<div class="empty-state">Error: ${err.message}</div>`; }
}

function render() {
  const body = document.getElementById('list-body');
  if (complaints.length === 0) { body.innerHTML = '<div class="empty-state">🎉 Koi complaint nahi hai.</div>'; return; }
  body.innerHTML = complaints.map(c => `
    <div class="comp-card ${c.priority === 'Urgent' ? 'urgent' : ''}">
      <div class="comp-top">
        <h4>${c.customerName || '-'} <span class="priority-badge pr-${c.priority || 'Normal'}">${c.priority || 'Normal'}</span></h4>
        <select class="status-select s-${(c.status || 'Open').replace(' ', '-')}" onchange="window.updateStatus('${c.id}', this.value)">
          <option value="Open" ${c.status === 'Open' || !c.status ? 'selected' : ''}>Open</option>
          <option value="Assigned" ${c.status === 'Assigned' ? 'selected' : ''}>Assigned</option>
          <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
          <option value="Resolved" ${c.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
          <option value="Closed" ${c.status === 'Closed' ? 'selected' : ''}>Closed</option>
        </select>
      </div>
      <div class="comp-meta"><span>${c.category || '-'}</span><span>${c.customerMobile || '-'}</span><span>${c.createdAt ? new Date(c.createdAt).toLocaleDateString('en-IN') : '-'}</span></div>
      <div class="comp-desc">${c.description || ''}</div>
    </div>`).join('');
}

window.updateStatus = async function (id, status) {
  try {
    await updateDoc(doc(tenantCollection(currentUid, "complaints"), id), { status });
    const c = complaints.find(x => x.id === id);
    if (c) c.status = status;
  } catch (e) { alert('Update fail hua: ' + e.message); }
};

window.openAddModal = function () {
  document.getElementById('c-name').value = '';
  document.getElementById('c-mobile').value = '';
  document.getElementById('c-desc').value = '';
  document.getElementById('add-modal').classList.add('open');
};
window.closeAddModal = function () { document.getElementById('add-modal').classList.remove('open'); };

window.saveComplaint = async function () {
  const name = document.getElementById('c-name').value.trim();
  if (!name) { alert('Customer name daalo.'); return; }
  try {
    await addDoc(tenantCollection(currentUid, "complaints"), {
      customerName: name, customerMobile: document.getElementById('c-mobile').value.trim(),
      category: document.getElementById('c-category').value, priority: document.getElementById('c-priority').value,
      description: document.getElementById('c-desc').value.trim(),
      status: 'Open', createdAt: new Date().toISOString(),
    });
    window.closeAddModal();
    load();
  } catch (e) { alert('Save fail hua: ' + e.message); }
};
</script>
</body>
</html>
