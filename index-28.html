<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FRALEN Calling CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F0F2FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: white; border-radius: 20px; padding: 36px 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 40px rgba(27,42,107,0.1); }
  .head { text-align: center; margin-bottom: 26px; }
  .logo { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 900; color: #1B2A6B; letter-spacing: 2px; }
  .logo span { color: #F59E0B; }
  .sub { font-size: 12.5px; color: #6B7280; margin-top: 4px; letter-spacing: 0.5px; }
  .note { background: #EEF1FE; color: #1B2A6B; font-size: 12px; padding: 10px 12px; border-radius: 9px; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border: 1.5px solid #D1D5DB; border-radius: 10px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #4F6BF0; }
  .forgot { text-align: right; margin: -6px 0 16px; }
  .forgot a { font-size: 12px; color: #4F6BF0; cursor: pointer; text-decoration: none; font-weight: 500; }
  .btn { width: 100%; padding: 13px; background: #1B2A6B; color: white; border: none; border-radius: 10px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #2A3F8F; }
  .msg { text-align: center; font-size: 12.5px; margin-top: 12px; display: none; }
  .msg.error { color: #DC2626; display: block; }
  .msg.ok { color: #059669; display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="logo">📞 FRALEN <span>CALLING CRM</span></div>
    <div class="sub">Telecalling &amp; Customer Relationship System</div>
  </div>
  <div class="note">Yeh apne FRALEN Optical CRM ke <b>same email/password</b> se login hota hai — data automatically link hai.</div>

  <form id="loginForm" onsubmit="return false;">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="Your FRALEN CRM email" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your FRALEN CRM password" required/>
    </div>
    <div class="forgot"><a onclick="window.handleForgot()">Forgot password?</a></div>
    <button class="btn" type="submit" id="login-btn">Sign In</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { auth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail } from "./firebase-config.js";

onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = "dashboard.html";
});

document.getElementById('loginForm').addEventListener('submit', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const msg = document.getElementById('msg');
  btn.textContent = 'Signing in...';
  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "dashboard.html";
  } catch (err) {
    msg.textContent = 'Login fail hua: ' + err.message;
    msg.className = 'msg error';
    btn.textContent = 'Sign In';
  }
});

window.handleForgot = async function () {
  const email = document.getElementById('email').value.trim();
  const msg = document.getElementById('msg');
  if (!email) { msg.textContent = 'Pehle email likho.'; msg.className = 'msg error'; return; }
  try {
    await sendPasswordResetEmail(auth, email);
    msg.textContent = 'Reset link bhej diya ' + email + ' par.';
    msg.className = 'msg ok';
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    msg.className = 'msg error';
  }
};
</script>

</body>
</html>
